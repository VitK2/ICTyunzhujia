<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1c4a3b"><title>云筑家 · 把理想的家，先放进眼前</title></head><body><div id="root"><div style="padding:80px 24px;text-align:center;font-family:'Microsoft YaHei',sans-serif;color:#245440"><h1>云筑家</h1><p id="startup-message">正在加载工作台…首次打开需要载入本地程序。</p><noscript>请启用浏览器的JavaScript后重新打开。</noscript></div></div><div id="startup-error" role="alert" hidden style="position:fixed;inset:15% 10%;z-index:9999;padding:32px;background:#fffaf0;border:1px solid #bc9a70;border-radius:12px;font-family:'Microsoft YaHei',sans-serif;color:#3b4b36"><h2>网页程序未能加载</h2><p id="startup-detail"></p><p>请双击项目目录中的「启动云筑家.cmd」，使用它生成的地址。不要直接打开dist/index.html。</p><a href="?mode=2d">重新打开二维兼容版</a> · <button onclick="location.reload()">刷新页面</button></div><script>
(function(){function show(message){document.getElementById('startup-detail').textContent=message;document.getElementById('startup-error').hidden=false;}if(location.protocol==='file:'){show('当前以文件方式打开，程序需要本地HTTP服务。');}window.addEventListener('error',function(e){if(e.target&&e.target.tagName==='SCRIPT'){show('程序文件加载失败，请重新启动本地服务。');}else if(e.message){show(e.message);}},true);window.addEventListener('unhandledrejection',function(e){show(String(e.reason&&e.reason.message||e.reason));});setTimeout(function(){var p=document.getElementById('startup-message');if(p)p.textContent='加载超时。请重新运行启动云筑家.cmd，并刷新页面。';},20000);})();
</script><script type="module" src="/src/main.tsx"></script></body></html>
